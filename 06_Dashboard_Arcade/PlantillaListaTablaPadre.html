<!--
  ArcGIS Dashboards clasico > Lista > Fuente HTML.
  Fuente de datos: tabla padre del Survey, sin expresion Arcade.
-->
<div style="margin:0 0 10px 0;padding:0;background:#ffffff;border:1px solid #d6e0e6;border-left:6px solid #007ac2;border-radius:9px;font-family:Arial,sans-serif;color:#253746;box-shadow:0 2px 6px rgba(31,45,61,.10);">
  <table style="width:100%;border-collapse:collapse;table-layout:fixed;">
    <tbody>
      <tr>
        <td style="padding:12px 14px 5px 14px;font-size:16px;font-weight:bold;line-height:1.25;color:#172b4d;overflow-wrap:anywhere;">
          {identificador}
        </td>
        <td style="width:92px;padding:12px 12px 5px 4px;text-align:right;vertical-align:top;">
          <span style="display:inline-block;padding:4px 8px;border-radius:12px;background:#e5f5ea;color:#236b3b;font-size:10px;font-weight:bold;letter-spacing:.3px;">
            {validacion}
          </span>
        </td>
      </tr>
      <tr>
        <td colspan="2" style="padding:0 14px 10px 14px;font-size:13px;line-height:1.35;color:#506176;overflow-wrap:anywhere;">
          {nombre_canal} &middot; {singularidades}
        </td>
      </tr>
    </tbody>
  </table>

  <table style="width:100%;border-collapse:collapse;table-layout:fixed;border-top:1px solid #edf1f4;font-size:11px;">
    <tbody>
      <tr style="background:#f7f9fa;">
        <td style="width:34%;padding:7px 9px;color:#52606d;vertical-align:top;">
          <span style="display:block;font-size:9px;font-weight:bold;color:#287d8e;text-transform:uppercase;">Obra</span>
          {n_obra}
        </td>
        <td style="width:33%;padding:7px 9px;border-left:1px solid #e2e8ed;color:#52606d;vertical-align:top;overflow-wrap:anywhere;">
          <span style="display:block;font-size:9px;font-weight:bold;color:#287d8e;text-transform:uppercase;">Comuna</span>
          {comuna}
        </td>
        <td style="width:33%;padding:7px 9px;border-left:1px solid #e2e8ed;color:#52606d;vertical-align:top;">
          <span style="display:block;font-size:9px;font-weight:bold;color:#287d8e;text-transform:uppercase;">Fecha</span>
          {fecha_manual}
        </td>
      </tr>
      <tr>
        <td colspan="2" style="padding:7px 9px;border-top:1px solid #e2e8ed;color:#52606d;overflow-wrap:anywhere;">
          <b style="color:#385563;">Unidad:</b> {unidad}
        </td>
        <td style="padding:7px 9px;border-top:1px solid #e2e8ed;border-left:1px solid #e2e8ed;color:#52606d;overflow-wrap:anywhere;">
          <b style="color:#385563;">Revisor:</b> {nombre_revisor}
        </td>
      </tr>
    </tbody>
  </table>
</div>
